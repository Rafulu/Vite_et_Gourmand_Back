services: 
  php:
    build: ./back
    ports:
      - "8000:80"
    volumes:
      - ./back:/var/www/html
      - php_sessions:/var/lib/php/sessions
    command: >
      bash -c "a2enmod rewrite && sed -i 's/AllowOverride None/AllowOverride All/g' /etc/apache2/apache2.conf && apache2-foreground"


  mariadb:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: vite-et-gourmand
      MYSQL_USER: jose
      MYSQL_PASSWORD: admin
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./back/sql:/docker-entrypoint-initdb.d

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mariadb

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  front:
    image: nginx:alpine
    ports:
      - "4200:80"
    volumes:
      - ./front:/usr/share/nginx/html

volumes:
  mariadb_data:
  mongodb_data:
  php_sessions: